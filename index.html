/* ------------------------------ Router ------------------------------ */
function useHashRoute() {
  const read = () => (location.hash.replace(/^#/, '') || '/');
  const [route, setRoute] = useState(read());
  useEffect(() => {
    const on = () => { setRoute(read()); window.scrollTo({ top: 0 }); };
    window.addEventListener('hashchange', on);
    return () => window.removeEventListener('hashchange', on);
  }, []);
  return route;
}
const go = (to: string) => { location.hash = to; };
function L({ to, className = '', children, onClick, ...rest }: any) {
  return <a href={'#' + to} className={className} onClick={onClick} {...rest}>{children}</a>;
}

function Photo({ slot, tone = '#d9d6cf', ratio = 'aspect-[3/4]', label, className = '', children, hover, eager = false }:
  { slot: string; tone?: string; ratio?: string; label?: string; className?: string; children?: any; hover?: string; eager?: boolean }) {
  const { images, setImage, imageMode } = useApp();
  const [over, setOver] = useState(false);
  const src = images[slot] || IMAGE_SOURCES[slot];
  const hoverSrc = hover && (images[hover] || IMAGE_SOURCES[hover]);
  const [loaded, setLoaded] = useState(false);
  const light = parseInt(tone.slice(1), 16) > 0x999999;
  const onFile = (f?: File) => {
    if (!f || !f.type.startsWith('image/')) return;
    const r = new FileReader(); r.onload = () => setImage(slot, String(r.result)); r.readAsDataURL(f);
  };
  return (
    <div
      className={`relative overflow-hidden ${ratio} ${className}`}
      style={{ background: src ? '#f2f2f2' : tone }}
      onDragOver={e => { if (imageMode) { e.preventDefault(); setOver(true); } }}
      onDragLeave={() => setOver(false)}
      onDrop={e => { if (!imageMode) return; e.preventDefault(); setOver(false); onFile(e.dataTransfer.files[0]); }}
    >
      {src ? (
        <>
          <img src={src} alt={label || ''} loading={eager ? 'eager' : 'lazy'} decoding="async" onLoad={() => setLoaded(true)}
            className={`absolute inset-0 w-full h-full object-cover transition-opacity duration-500 ${loaded ? 'opacity-100' : 'opacity-0'}`} />
          {hoverSrc && <img src={hoverSrc} alt="" loading="lazy" decoding="async" className="absolute inset-0 w-full h-full object-cover opacity-0 group-hover:opacity-100 transition-opacity duration-300" />}
        </>
      ) : (
        <>
          <div className="absolute inset-0 grain" />
          <div className="absolute inset-0" style={{ background: `radial-gradient(120% 80% at 30% 20%, rgba(255,255,255,${light ? .25 : .10}), transparent 60%)` }} />
          <div className={`absolute left-3 bottom-3 right-3 text-[9px] uppercase tracking-mi ${light ? 'text-black/45' : 'text-white/45'}`}>
            Image placeholder{label ? ' · ' + label : ''}
          </div>
        </>
      )}
      {children}
      {imageMode && (
        <label className={`absolute top-2 right-2 z-20 cap bg-white text-black px-2 py-1 cursor-pointer ${over ? 'ring-1 ring-black' : ''}`} onClick={e => e.stopPropagation()}>
          {src ? 'Replace' : 'Drop / add image'}
          <input type="file" accept="image/*" className="hidden" onChange={e => onFile(e.target.files?.[0] || undefined)} />
          {images[slot] && <button className="ml-2 underline" onClick={e => { e.preventDefault(); setImage(slot, null); }}>Remove</button>}
        </label>
      )}
    </div>
  );
}

function Carousel({ items }: { items: Product[] }) {
  const ref = useRef<HTMLDivElement>(null);
  const [prog, setProg] = useState(0);
  const onScroll = () => { const el = ref.current!; setProg(el.scrollLeft / Math.max(1, el.scrollWidth - el.clientWidth)); };
  const nudge = (d: number) => ref.current?.scrollBy({ left: d * ref.current.clientWidth * 0.8, behavior: 'smooth' });
  return (
    <div className="relative">
      <div ref={ref} onScroll={onScroll} className="flex gap-2 md:gap-3 overflow-x-auto noscroll snap-x px-2 md:px-3">
        {items.map(p => <div key={p.id} className="snap-start shrink-0 w-[46%] md:w-[24%] lg:w-[19%]"><ProductCard p={p} /></div>)}
      </div>
      <div className="px-4 md:px-6 mt-4 flex items-center gap-4">
        <div className="h-px bg-black/15 flex-1 relative" aria-label={`Carousel progress of ${Math.round(prog * 100)}%`}>
          <div className="absolute inset-y-0 left-0 bg-black" style={{ width: `${Math.max(8, prog * 100)}%` }} />
        </div>
        <button className="cap" onClick={() => nudge(-1)} aria-label="Previous">←</button>
        <button className="cap" onClick={() => nudge(1)} aria-label="Next">→</button>
      </div>
    </div>
  );
}

function Category({ cat }: { cat: string }) {
  const meta = CAT_META[cat];
  const [type, setType] = useState('All');
  const [sort, setSort] = useState('featured');
  if (!meta) return <NotFound />;
  const base = PRODUCTS.filter(meta.filter);
  const types = ['All', ...Array.from(new Set(base.map(p => p.type)))];
  let items = base.filter(p => type === 'All' || p.type === type);
  if (sort === 'low') items = [...items].sort((a, b) => a.price - b.price);
  if (sort === 'high') items = [...items].sort((a, b) => b.price - a.price);
  return (
    <div className="fade">
      <div className="px-4 md:px-6 pt-10 pb-6">
        <h1 className="text-[34px] md:text-[48px] leading-none tracking-[-0.02em]">{meta.title}</h1>

      <FilterBar types={types} type={type} setType={setType} sort={sort} setSort={setSort} count={items.length} />

        <L to="/pre-owned" className="mx-2 md:mx-3 mb-8 flex justify-between items-center border border-black px-4 py-3 cap hover:bg-black hover:text-white transition-colors">

/* ========================= DIGITAL PRODUCT PASSPORT ========================= */

function QR({ seed, size = 116 }: { seed: string; size?: number }) {
  const N = 25;
  let h = 2166136261; for (const c of seed) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  const rnd = () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 1000) / 1000; };
  const finder = (x: number, y: number) => { for (const [fx, fy] of [[0, 0], [N - 7, 0], [0, N - 7]]) { const dx = x - fx, dy = y - fy; if (dx >= 0 && dx < 7 && dy >= 0 && dy < 7) return (dx === 0 || dx === 6 || dy === 0 || dy === 6 || (dx > 1 && dx < 5 && dy > 1 && dy < 5)) ? 1 : 0; } return -1; };
  const cells: any[] = [];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const f = finder(x, y); const on = f === -1 ? rnd() > 0.52 : f === 1; if (on) cells.push(<rect key={x + '-' + y} x={x} y={y} width="1" height="1" />); }
  return <svg viewBox={`-2 -2 ${N + 4} ${N + 4}`} width={size} height={size} role="img" aria-label="Prototype QR code — not scannable"><rect x="-2" y="-2" width={N + 4} height={N + 4} fill="#fff" /><g fill="#000">{cells}</g></svg>;
}

function ProductPassport({ p }: { p: Product }) {
  const [step, setStep] = useState(0);
  const PENDING = <em className="text-black/50 not-italic">Information pending verification</em>;
  const steps = [
    { k: 'Material', rows: [['Composition', <>{p.colour} (from product name). Full composition: {PENDING}</>], ['Material origin', PENDING], ['Recycled content', <>None claimed. {PENDING}</>]] },
    { k: 'Supplier', rows: [['Tannery / mill', PENDING], ['Certifications', <>None claimed for this product. Proposed objective: LWG Gold-rated tanneries.</>]] },
    { k: 'Production', rows: [['Made in', 'Handmade in Europe (brand statement)'], ['Facility', PENDING]] },
    { k: 'Product', rows: [['Style', `${p.name} — ${p.colour}`], ['Product ID', <span className="font-mono text-[11px]">MI-{p.id.toUpperCase().slice(0, 18)}</span>]] },
    { k: 'Care', rows: [['Care', 'Clean with a soft dry cloth, nourish leather regularly, store with shoe trees away from heat.'], ['Repair', <><L to="/keep-the-story-going" className="underline">Keep the Story Going</L> — 2-year repair guarantee (proposed)</>]] },
    { k: 'Next Life', rows: [['Resell', <><L to="/pre-owned/sell" className="underline">Give your Miista a second story</L> — store credit after assessment (proposed)</>], ['End of life', <><L to="/miista-x-scrap" className="underline">Miista × SCRAP</L> collection (proposed concept)</>]] },
  ];
  return (
    <div>
      <div className="flex gap-5 items-start">
        <div className="shrink-0 border border-black p-1"><QR seed={p.id} /></div>
        <div className="text-[12px] text-black/70">
          <div className="cap text-black mb-1">Digital Product Passport</div>
          Prototype interface. Code is decorative and not scannable. Data marked “pending verification” has not been confirmed with Miista or its suppliers.
          <div className="mt-2 text-black/50">Our research references the Emile Boots as an existing traceability example; this interface extends that idea to every style.</div>
        </div>
      </div>
      <ol className="mt-6 flex items-center text-[10px] uppercase tracking-mi overflow-x-auto noscroll" aria-label="Product journey">
        {steps.map((s, i) => (
          <li key={s.k} className="flex items-center shrink-0">
            <button onClick={() => setStep(i)} aria-current={step === i} className={`py-1 ${step === i ? 'border-b border-black' : 'text-black/40 hover:text-black'}`}>{s.k}</button>
            {i < steps.length - 1 && <span className="mx-2 text-black/30">→</span>}
          </li>
        ))}
      </ol>
      <dl className="mt-4 border-t border-black/10 fade" key={step}>
        {steps[step].rows.map(([k, v]: any) => (
          <div key={k} className="grid grid-cols-[110px_1fr] gap-3 py-2 border-b border-black/10 text-[12px]"><dt className="text-black/50">{k}</dt><dd>{v}</dd></div>
        ))}
      </dl>
    </div>
  );
}

function itemInfo(i: BagItem) {
  if (i.kind === 'preowned') { const po = PRE_OWNED.find(x => x.id === i.id)!; const p = P(po.productId); return { p, price: po.price, label: `Pre-Owned · ${po.condition}`, link: '/pre-owned/' + po.id }; }
  const p = P(i.id); return { p, price: p.price, label: '', link: '/product/' + p.id };
}

function BagDrawer() {
  const { bag, bagOpen, setBagOpen, removeFromBag, setQty } = useApp();
  useEffect(() => { const k = (e: KeyboardEvent) => e.key === 'Escape' && setBagOpen(false); window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k); }, []);
  if (!bagOpen) return null;
  const total = bag.reduce((n, i) => n + itemInfo(i).price * i.qty, 0);
  return (
    <div className="fixed inset-0 z-50" role="dialog" aria-label="Shopping bag">
      <div className="absolute inset-0 bg-black/30" onClick={() => setBagOpen(false)} />
      <aside className="absolute right-0 top-0 bottom-0 w-full sm:w-[420px] bg-white flex flex-col fade">
        <div className="h-12 md:h-14 px-4 flex items-center justify-between border-b border-black/10 cap"><span>Bag ({bag.reduce((n, i) => n + i.qty, 0)})</span><button onClick={() => setBagOpen(false)}>Close</button></div>
        <div className="flex-1 overflow-y-auto">
          {bag.length === 0 ? <p className="p-4 text-black/60">Your bag is empty.</p> : bag.map(i => {
            const { p, price, label, link } = itemInfo(i);
            return (
              <div key={i.key} className="flex gap-3 p-4 border-b border-black/10">
                <L to={link} onClick={() => setBagOpen(false)} className="w-20 shrink-0"><Photo slot={p.id} tone={p.tone} /></L>
                <div className="flex-1 flex flex-col">
                  <div className="flex justify-between gap-2"><div>{p.name}</div><div>{eur(price * i.qty)}</div></div>
                  <div className="text-black/50">{p.colour}</div>
                  {label && <div className="mt-1"><Tag>{label}</Tag></div>}
                  <div className="text-black/50 mt-1">Size {i.size}</div>
                  <div className="mt-auto pt-2 flex justify-between items-center cap">
                    {i.kind === 'new' ? (
                      <div className="flex items-center gap-3" aria-label="Quantity">
                        <button onClick={() => setQty(i.key, i.qty - 1)} aria-label="Decrease">−</button><span>{i.qty}</span><button onClick={() => setQty(i.key, i.qty + 1)} aria-label="Increase">+</button>
                      </div>
                    ) : <span className="text-black/50">Unique piece</span>}
                    <button className="ulink" onClick={() => removeFromBag(i.key)}>Remove</button>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
        {bag.length > 0 && (
          <div className="p-4 border-t border-black/10">
            <div className="flex justify-between mb-3"><span className="cap">Subtotal</span><span>{eur(total)}</span></div>
            <L to="/checkout" onClick={() => setBagOpen(false)} className="btn w-full">Checkout</L>
            <p className="mt-2 text-[11px] text-black/45">Prototype: no payment is taken.</p>
          </div>
        )}
      </aside>
    </div>
  );
}

  const total = bag.reduce((n, i) => n + itemInfo(i).price * i.qty, 0);
  if (done) return (
    <Confirmation title="Order placed (demo)" ref_={done.ref} lines={[
      `${done.items} item(s) · ${eur(done.total)}`,
      method === 'collect' ? `Click & Collect at ${STORES.find(s => s.id === storeId)?.city} (proposed service)` : 'Home delivery in recycled cardboard packaging (proposed)',

            <div className="sm:col-span-2"><Field label="Delivery address" error={errs.address}><input className={`field ${errs.address ? 'err' : ''}`} value={form.address} onChange={e => setForm({ ...form, address: e.target.value })} /></Field></div>
          ) : (
            <div className="sm:col-span-2"><Field label="Collection store" error={errs.store}>
              <select className={`field ${errs.store ? 'err' : ''}`} value={storeId} onChange={e => setStoreId(e.target.value)}>

function Field({ label, error, children, hint }: any) {
  return (
    <label className="block">
      <span className="cap text-black/60">{label}</span>
      {children}
      {hint && !error && <span className="block text-[11px] text-black/45 mt-1">{hint}</span>}
      {error && <span className="block text-[11px] text-[#b00020] mt-1" role="alert">{error}</span>}
    </label>
  );
}

function PhotoUpload({ files, setFiles, error }: { files: string[]; setFiles: (f: any) => void; error?: string }) {
  const onPick = (list: FileList | null) => {
    if (!list) return;
    Array.from(list).slice(0, 4 - files.length).forEach(f => { if (!f.type.startsWith('image/')) return; const r = new FileReader(); r.onload = () => setFiles(prev => [...prev, String(r.result)].slice(0, 4) as any); r.readAsDataURL(f); });
  };
  return (
    <div>
      <span className="cap text-black/60">Photographs (up to 4)</span>
      <div className="mt-2 flex flex-wrap gap-2">
        {files.map((src, i) => (
          <div key={i} className="relative w-20 h-24 bg-black/5"><img src={src} alt={`Upload ${i + 1}`} className="w-full h-full object-cover" />
            <button type="button" onClick={() => setFiles(files.filter((_, j) => j !== i))} className="absolute top-1 right-1 bg-white text-[10px] px-1" aria-label="Remove photo">×</button></div>
        ))}
        {files.length < 4 && (
          <label className={`w-20 h-24 border border-dashed flex items-center justify-center text-center cap !text-[9px] cursor-pointer ${error ? 'border-[#b00020]' : 'border-black/40 hover:border-black'}`}>
            Add<br />photo<input type="file" accept="image/*" multiple className="hidden" onChange={e => onPick(e.target.files)} />
          </label>
        )}
      </div>
      <span className="block text-[11px] text-black/45 mt-1">Images stay in your browser — nothing is uploaded.</span>
      {error && <span className="block text-[11px] text-[#b00020] mt-1" role="alert">{error}</span>}
    </div>
  );
}

function Confirmation({ title, ref_, lines, note, actions }: any) {

    <div className="fade px-4 md:px-6 py-20 max-w-2xl">
      <div className="cap text-black/50">Reference</div>

function SellFlow() {
  const shoes = useMemo(() => PRODUCTS.filter(p => p.cat === 'shoes'), []);
  const [step, setStep] = useState(0);
  const [f, setF] = useState({ product: '', size: '', condition: '', date: '', store: '', name: '', email: '', phone: '' });
  const [photos, setPhotos] = useState<string[]>([]);
  const [errs, setErrs] = useState<Record<string, string>>({});
  const [done, setDone] = useState('');
  const set = (k: string) => (e: any) => setF({ ...f, [k]: e.target.value });
  const validate = (s: number) => {
    const er: Record<string, string> = {};
    if (s === 0) { if (!f.product) er.product = 'Select your model'; if (!f.size) er.size = 'Select a size'; if (!f.date) er.date = 'Approximate date required'; }
    if (s === 1) { if (!f.condition) er.condition = 'Select a condition'; if (photos.length < 2) er.photos = 'Add at least two photos (side and sole)'; }
    if (s === 2) { if (!f.store) er.store = 'Select a store'; if (!f.name.trim()) er.name = 'Required'; if (!/\S+@\S+\.\S+/.test(f.email)) er.email = 'Enter a valid email'; }
    setErrs(er); return !Object.keys(er).length;
  };
  const next = () => { if (validate(step)) setStep(step + 1); };
  const STEPS = ['Your pair', 'Condition', 'Drop-off & contact', 'Review'];
  if (done) return (

function Router({ route }: { route: string }) {
  const path = route.split('#')[0].split('?')[0];
  const seg = path.split('/').filter(Boolean);
  switch (seg[0]) {
    case undefined: return <Home />;
    case 'shop': return <Category key={seg[1]} cat={seg[1]} />;
    case 'product': return <ProductDetail key={seg[1]} id={seg[1]} />;
    case 'pre-owned':
      if (seg[1] === 'sell') return <SellFlow />;
      return seg[1] ? <PreOwnedDetail key={seg[1]} id={seg[1]} /> : <PreOwnedPage />;
    case 'keep-the-story-going': return <RepairPage />;
    case 'miista-x-scrap': return <ScrapPage />;
    case 'our-practices': return <PracticesPage />;
    case 'stores': return <StoresPage />;
    case 'stories': return seg[1] ? <StoryPage id={seg[1]} /> : <Stories />;
    case 'wishlist': return <Wishlist />;
    case 'checkout': return <Checkout />;
    case 'product-care': return <InfoPage title="Product Care"><CareList cat="shoes" /><p>Need more than care? Request a repair through <L to="/keep-the-story-going" className="underline">Keep the Story Going</L>.</p></InfoPage>;
    case 'shipping': return <InfoPage title="Shipping"><p>Orders are dispatched in recycled cardboard packaging without unnecessary single-use plastic (proposed).</p><p>Click & Collect at participating stores is available as an illustrative option at checkout.</p><VerifyNote /></InfoPage>;
    case 'returns': return <InfoPage title="Returns"><p>Please reuse your original Miista box for returns where possible (proposed).</p><p>Looking to pass on a pair you’ve worn? <L to="/pre-owned/sell" className="underline">Give your Miista a second story</L>.</p><VerifyNote /></InfoPage>;
    case 'faqs': return <InfoPage title="FAQs">
      <Accordion title="Is my pair covered by the repair guarantee?" id="f1"><p>In the proposed programme, eligible footwear is covered for two years from purchase. Submit a request and we’ll confirm.</p></Accordion>
      <Accordion title="How much store credit will I get for Pre-Owned?" id="f2"><p>Credit is set after our team assesses and accepts your pair. There is no fixed amount.</p></Accordion>
      <Accordion title="Is Miista × SCRAP live?" id="f3"><p>No. It is a proposed concept developed for an academic project.</p></Accordion>
      <div className="border-t border-black" /></InfoPage>;
    case 'contact': return <InfoPage title="Contact Us"><p>This prototype does not connect to Miista customer service. For real enquiries, visit miista.com.</p></InfoPage>;
    case 'privacy': return <InfoPage title="Privacy Policy"><p>This prototype stores your bag, wishlist and any images you add in your own browser only. Nothing is sent anywhere.</p></InfoPage>;
    case 'account': return <InfoPage title="Account"><p>Accounts are not available in this prototype.</p><L to="/wishlist" className="btn btn-o">View wishlist</L></InfoPage>;
    default: return <NotFound />;
  }
}

function App() {
  const route = useHashRoute();
  const [bag, setBag] = useState<BagItem[]>(store.get('bag', []));
  const [wish, setWish] = useState<string[]>(store.get('wish', []));
  const [images, setImages] = useState<Record<string, string>>(store.get('images', {}));
  const [bagOpen, setBagOpen] = useState(false);
  const [imageMode, setImageMode] = useState(false);
  const [msg, setMsg] = useState('');
  const t = useRef<any>();
  useEffect(() => store.set('bag', bag), [bag]);
  useEffect(() => store.set('wish', wish), [wish]);
  useEffect(() => store.set('images', images), [images]);

  const toast = (m: string) => { setMsg(m); clearTimeout(t.current); t.current = setTimeout(() => setMsg(''), 2200); };
  const ctx: Ctx = {
    bag, bagOpen, setBagOpen, wish, images, imageMode, setImageMode, toast,
    addToBag: (i) => {
      const key = i.kind + ':' + i.id + ':' + i.size;
      if (i.kind === 'preowned' && bag.some(b => b.key === key)) { toast('Already in your bag'); return false; }
      setBag(prev => prev.some(b => b.key === key) ? prev.map(b => b.key === key ? { ...b, qty: b.qty + 1 } : b) : [...prev, { ...i, key, qty: 1 }]);
      setBagOpen(true); return true;
    },
    removeFromBag: (k) => setBag(prev => prev.filter(b => b.key !== k)),
    setQty: (k, q) => setBag(prev => q <= 0 ? prev.filter(b => b.key !== k) : prev.map(b => b.key === k ? { ...b, qty: Math.min(q, 5) } : b)),
    clearBag: () => setBag([]),
    toggleWish: (id) => { setWish(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]); toast(wish.includes(id) ? 'Removed from wishlist' : 'Saved to wishlist'); },
    setImage: (k, v) => setImages(prev => { const n = { ...prev }; if (v) n[k] = v; else delete n[k]; return n; }),
  };
  return (
    <AppCtx.Provider value={ctx}>
      {imageMode && <div className="sticky top-0 z-50 bg-black text-white cap px-4 py-2 flex justify-between"><span>Image mode — drop a photo on any slot (saved in this browser)</span><button onClick={() => setImageMode(false)} className="underline">Done</button></div>}
      <Header route={route} />
      <main key={route} className="min-h-[60vh]"><Router route={route} /></main>
      <Footer />
      <BagDrawer />
      <PrototypeBadge />
      <Toast msg={msg} />
    </AppCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')!).render(<App />);
</script>
</body>
</html>
